<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- Halo lumineux en arrière-plan -->
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#e6a23c" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#e6a23c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fond avec effet de lueur -->
  <circle cx="130" cy="130" r="115" fill="url(#glow)" />

  <!-- Lignes de connexion (Circuit) -->
  <g stroke="#5fd1cc" stroke-width="1.4" fill="none" opacity="0.6">
    <path d="M34 118 H60 V125" />
    <path d="M130 205 V180" />
    <path d="M175 122 L200 95" />
  </g>
  <g fill="#5fd1cc" opacity="0.85">
    <circle cx="34" cy="118" r="3" />
  </g>

  <!-- Icône Profil / Utilisateur (à gauche) -->
  <circle cx="34" cy="118" r="13" fill="#1d2530" stroke="#5fd1cc" stroke-width="1.6" />
  <path d="M28 118a6 6 0 0 1 12 0" fill="none" stroke="#5fd1cc" stroke-width="1.4" />
  <circle cx="34" cy="121" r="1.6" fill="#5fd1cc" />

  <!-- Écran principal / Dashboard -->
  <rect x="60" y="70" width="120" height="90" rx="6" fill="#232d39" stroke="#e6a23c" stroke-width="1.6" />
  <rect x="70" y="80" width="100" height="70" rx="3" fill="#161d26" stroke="#384453" stroke-width="1" />
  
  <!-- Jauge / Graphique circulaire dans l'écran -->
  <circle cx="93" cy="115" r="14" fill="none" stroke="#384453" stroke-width="3" />
  <path d="M93 101a14 14 0 0 1 9.9 23.9" fill="none" stroke="#e6a23c" stroke-width="3" stroke-linecap="round" />
  <line x1="93" y1="115" x2="99" y2="107" stroke="#e6a23c" stroke-width="1.6" stroke-linecap="round" />
  
  <!-- Courbe / Graphique dans l'écran -->
  <polyline points="112,138 122,128 133,133 144,116 155,122 163,108" fill="none" stroke="#5fd1cc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Voyants / Indicateurs -->
  <circle cx="160" cy="88" r="2.4" fill="#5fd1cc" />
  <circle cx="150" cy="88" r="2.4" fill="#e6a23c" />

  <!-- Carte / Module du bas -->
  <rect x="112" y="180" width="36" height="25" rx="3" fill="#1d2530" stroke="#e6a23c" stroke-width="1.6" />
  <path d="M118 190h24M118 196h16" stroke="#e6a23c" stroke-width="1.3" opacity="0.8" />

  <!-- Nuage / Cloud (en haut à droite) -->
  <path d="M212 78c-1-6-6-10-12-10-5 0-9 3-10 7-1 0-2-1-4-1-6 0-11 4-11 10 0 5 4 10 10 10h25c6 0 10-4 10-9 0-4-3-8-8-7z" fill="#1d2530" stroke="#5fd1cc" stroke-width="1.6" />
</svg>
